apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-service
  namespace: student-teacher-portal
  labels:
    app: attendance-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance-service
  template:
    metadata:
      labels:
        app: attendance-service
    spec:
      containers:
        - name: attendance-service
          image: <ECR_REPO_URI>/attendance-service:<IMAGE_TAG>   # replaced by CI/CD (Jenkins)
          ports:
            - containerPort: 3503
          env:
            - name: host
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: host
            - name: user
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: user
            - name: password
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: database
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: database
            - name: PORT
              value: "3503"
          readinessProbe:
            httpGet:
              path: /health
              port: 3503
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3503
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
  namespace: student-teacher-portal
spec:
  selector:
    app: attendance-service
  ports:
    - port: 3503
      targetPort: 3503
  type: ClusterIP
